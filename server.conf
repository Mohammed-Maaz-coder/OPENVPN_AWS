# OpenVPN Server Configuration

port 1194
proto udp
dev tun

# Certificates
ca ca.crt
cert server.crt
key server.key
dh dh.pem

# TLS Authentication
tls-auth ta.key 0

# Network Configuration
server 10.8.0.0 255.255.255.0

# Push settings to clients
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 8.8.8.8"

# Security
cipher AES-256-CBC
auth SHA256

# Connection settings
keepalive 10 120
persist-key
persist-tun

# Logging
status openvpn-status.log
log-append /var/log/openvpn.log
verb 3

# Allow multiple clients (optional)
duplicate-cn